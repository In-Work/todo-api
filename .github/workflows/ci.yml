name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # Указываем .NET 10, так как у вас TargetFramework net10.0
        dotnet-version: '10.0.x' 
        # Если '10.0.x' не найдет, попробуйте '10.0.*' или 'preview'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # Тесты пока закомментируем, так как мы их не видели в проекте
    # - name: Test
    #   run: dotnet test --no-build --verbosity normal